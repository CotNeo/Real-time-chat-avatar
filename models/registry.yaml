# Model registry (Section 23). Models are never auto-downloaded from arbitrary
# sources at runtime — only via scripts/models.py against the entries below,
# each with a known source/license/VRAM cost recorded before it's added here.
#
# This file is intentionally close to empty right now: Milestone 6 (face
# benchmarking) and Milestone 9 (voice benchmarking) are what earn a model a
# place here, with measured numbers, not guesses. Filled in incrementally —
# see docs/PROGRESS.md for what's actually been benchmarked so far.

face:
  face-detection:
    backend: onnx
    path: models/face/models/buffalo_l/det_10g.onnx
    source: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
    license: Non-commercial research purposes only (InsightFace project license)
    vram_mb: measured as part of the combined face pipeline — see docs/PROGRESS.md
  face-recognition:
    backend: onnx
    path: models/face/models/buffalo_l/w600k_r50.onnx
    source: https://github.com/deepinsight/insightface/releases/download/v0.7/buffalo_l.zip
    license: Non-commercial research purposes only (InsightFace project license)
    note: same downloaded pack as face-detection, no second download
  face-swap:
    backend: onnx
    path: models/face/models/inswapper/inswapper_128.onnx
    source: https://huggingface.co/datasets/Gourieff/ReActor/resolve/main/models/inswapper_128.onnx
    precision_note: >
      fp32 deliberately, NOT fp16. A/B tested on identical well-lit input on
      this RTX 2060: the fp16 variant produced blurred/smeared/discolored
      output while fp32 produced a clean sharp face. Do not "optimize" this
      back to fp16 without re-running that comparison.
    license: >
      UNCLEAR. InsightFace discontinued official distribution/maintenance of
      this model (now directs users to their commercial product). This is a
      community mirror (Gourieff/ReActor on Hugging Face), not an
      authoritative source. Used here only for local, single-user, consensual
      avatar experimentation on the operator's own likeness (Section 21) —
      never redistributed. See docs/PROGRESS.md, Milestone 5, for the full
      provenance discussion and the user's explicit decision to proceed.
    sha256: e4a3f08c753cb72d04e10aa0f7dbe3deebbf39567d4ead6dce08e98aa49e16af
    approx_disk_mb: 529
  face-occluder:
    backend: onnx
    path: models/face/models/masking/dfl_xseg.onnx
    source: https://huggingface.co/facefusion/models-3.0.0/resolve/main/dfl_xseg.onnx
    license: >
      From the FaceFusion model mirror; XSeg originates in DeepFaceLab
      (GPL-3.0). Local, non-redistributed use only.
    sha256: af105ae257170fdbc6a03460327b88d5c0b9a659aa4384fb8686ceead7294ad8
    approx_disk_mb: 67
    measured_cost_ms: ~46 (mixed CUDA/CPU; 107.7 CPU-only)
    alternatives_rejected: >
      bisenet_resnet_34 was slower (55.6 vs 44.5 ms) and barely rejected a
      skin-toned occluder (coverage drop 0.009 vs XSeg's 0.128) — it parses
      face regions rather than detecting obstruction.
  face-enhancer:
    backend: onnx
    path: models/face/models/enhancer/GFPGANv1.4.onnx
    source: https://huggingface.co/datasets/Gourieff/ReActor/resolve/main/models/facerestore_models/GFPGANv1.4.onnx
    license: >
      GFPGAN is Tencent ARC's, Apache-2.0 with a non-commercial restriction on
      some released weights. Same community-mirror caveat as face-swap above.
      Used strictly locally for consensual avatar experimentation (Section 21),
      never redistributed.
    sha256: 6548e54cbcf248af385248f0c1193b359c37a0f98b836282b09cf48af4fd2b73
    approx_disk_mb: 325
    io: 512x512 in/out
    measured_cost_ms: ~88 (GPU inference, RTX 2060) — see docs/PROGRESS.md 5c
    alternatives_rejected: >
      GPEN-BFR-512 measured 302.8 ms/frame vs GFPGAN's 126.9 ms on identical
      input — 2.4x slower for no visible quality advantage here, so GFPGAN is
      the default. RestoreFormer_PP and CodeFormer not benchmarked (CodeFormer
      ships only as .pth in this mirror, needing a PyTorch path this project
      doesn't otherwise carry for face restoration).

